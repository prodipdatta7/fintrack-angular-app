<app-auth-shell heading="Create your account" subheading="Start tracking income, expenses & event history">
    @if (errorMessage) {
        <div class="error-banner"><span class="material-icons">error</span> {{ errorMessage }}</div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-row">
            <mat-form-field appearance="outline">
                <mat-label>First Name</mat-label>
                <input matInput type="text" formControlName="firstName" placeholder="John" />
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Last Name</mat-label>
                <input matInput type="text" formControlName="lastName" placeholder="Doe" />
            </mat-form-field>
        </div>

        <mat-form-field appearance="outline">
            <mat-icon matPrefix>mail</mat-icon>
            <mat-label>Email Address</mat-label>
            <input matInput type="email" formControlName="email" placeholder="user@example.com" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-icon matPrefix>lock</mat-icon>
            <mat-label>Password</mat-label>
            <input
                matInput
                type="password"
                formControlName="password"
                placeholder="At least 6 characters"
                autocomplete="new-password"
            />
        </mat-form-field>

        <button type="submit" class="btn submit-btn" [disabled]="registerForm.invalid || isLoading">
            @if (isLoading) {
                <mat-spinner diameter="18" class="btn-spinner"></mat-spinner>
            } @else {
                <span>Register Account</span>
                <span class="material-icons">arrow_outward</span>
            }
        </button>
    </form>
</app-auth-shell>
