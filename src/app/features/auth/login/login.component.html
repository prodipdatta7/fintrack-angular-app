<app-auth-shell heading="Welcome back" subheading="Sign in to manage your accounts & transactions">
    @if (errorMessage) {
        <div class="error-banner"><span class="material-icons">error</span> {{ errorMessage }}</div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        <mat-form-field appearance="outline">
            <mat-icon matPrefix>mail</mat-icon>
            <mat-label>Email Address</mat-label>
            <input matInput type="email" formControlName="email" placeholder="user@example.com" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-icon matPrefix>lock</mat-icon>
            <mat-label>Password</mat-label>
            <input
                matInput
                type="password"
                formControlName="password"
                placeholder="••••••••"
                autocomplete="current-password"
            />
        </mat-form-field>

        <button type="submit" class="btn submit-btn" [disabled]="loginForm.invalid || isLoading">
            @if (isLoading) {
                <mat-spinner diameter="18" class="btn-spinner"></mat-spinner>
            } @else {
                <span>Access Portal</span>
                <span class="material-icons">arrow_outward</span>
            }
        </button>
    </form>
</app-auth-shell>
