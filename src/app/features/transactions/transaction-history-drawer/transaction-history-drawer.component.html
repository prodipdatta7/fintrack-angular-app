@if (visible) {
    <div class="drawer-overlay" (click)="close()">
        <div class="drawer-panel" (click)="$event.stopPropagation()">
            <div class="drawer-header">
                <div>
                    <h3><span class="material-icons">history</span> Audit Trail</h3>
                    <p class="subtitle">
                        Event Sourcing Stream for Transaction <code>#{{ transactionId }}</code>
                    </p>
                </div>
                <button (click)="close()" class="close-btn" aria-label="Close">
                    <span class="material-icons">close</span>
                </button>
            </div>

            <div class="drawer-body">
                <app-audit-timeline [events]="events" [isLoading]="isLoading" />

                @if (!isLoading && events.length > 0) {
                    <details class="json-details">
                        <summary>View raw event payloads</summary>
                        @for (event of events; track event.id) {
                            <pre><code>{{ formatJson(event.dataJson) }}</code></pre>
                        }
                    </details>
                }
            </div>
        </div>
    </div>
}
