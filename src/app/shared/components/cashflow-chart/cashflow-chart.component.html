<section class="chart card-glass">
    <header class="chart-header">
        <div>
            <h3 class="section-heading">
                <span class="material-icons">trending_up</span>
                {{ title() }}
            </h3>
            <p class="section-subheading">{{ subtitle() }}</p>
        </div>

        <div class="chart-controls">
            <app-timeframe-selector
                [timeframes]="timeframes()"
                [activeTimeframe]="activeTimeframe()"
                size="sm"
                ariaLabel="Chart timeframe"
                (timeframeChange)="selectTimeframe($event)"
                (customRangeChange)="customRangeChange.emit($event)"
            />
        </div>
    </header>

    @if (activeTimeframe() === 'Custom') {
        <div class="custom-range animate-fade-in">
            <span class="custom-range-label">Custom Date Window:</span>
            <label class="custom-range-field">
                <span>From</span>
                <input type="date" [(ngModel)]="customStart" (change)="emitCustomRange()" />
            </label>
            <label class="custom-range-field">
                <span>To</span>
                <input type="date" [(ngModel)]="customEnd" (change)="emitCustomRange()" />
            </label>
        </div>
    }

    <div class="chart-plot-wrap">
        @if (isLoading()) {
            <div class="chart-skeleton skeleton" aria-hidden="true"></div>
        } @else {
            <app-area-line-chart
                [points]="chartPoints()"
                [series]="chartSeries()"
                [floor]="floor()"
                [showLegend]="showLegend()"
                emptyMessage="No activity recorded in this period"
            />
        }
    </div>
</section>
