<div class="time-picker card-surface fade-in-up" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="picker-header">
        <div class="header-title">
            <span class="material-icons title-icon">schedule</span>
            <span class="title-text">Select Time</span>
        </div>
        <div class="header-actions">
            <button type="button" class="btn-now" (click)="setNow()" title="Set to current local time">
                <span class="material-icons">bolt</span>
                <span>Now</span>
            </button>
            <button type="button" (click)="close()" class="modal-close" aria-label="Close">
                <span class="material-icons">close</span>
            </button>
        </div>
    </div>

    <!-- Quick Presets -->
    <div class="presets-row">
        @for (preset of presets; track preset.label) {
            <button
                type="button"
                class="preset-chip"
                [class.active]="isPresetActive(preset)"
                (click)="applyPreset(preset)"
            >
                <span class="material-icons preset-icon">{{ preset.icon }}</span>
                <span>{{ preset.label }}</span>
            </button>
        }
    </div>

    <!-- Digital Display with Steppers -->
    <div class="digital-display">
        <!-- Hour Block -->
        <div class="display-unit">
            <button type="button" class="step-btn" (click)="incrementHour()" aria-label="Increment hour">
                <span class="material-icons">expand_less</span>
            </button>
            <div class="unit-value">{{ hourLabel }}</div>
            <button type="button" class="step-btn" (click)="decrementHour()" aria-label="Decrement hour">
                <span class="material-icons">expand_more</span>
            </button>
        </div>

        <div class="display-colon">:</div>

        <!-- Minute Block -->
        <div class="display-unit">
            <button type="button" class="step-btn" (click)="incrementMinute()" aria-label="Increment minute">
                <span class="material-icons">expand_less</span>
            </button>
            <div class="unit-value">{{ minuteLabel }}</div>
            <button type="button" class="step-btn" (click)="decrementMinute()" aria-label="Decrement minute">
                <span class="material-icons">expand_more</span>
            </button>
        </div>

        <!-- Period Toggle -->
        <div class="period-switch">
            <button
                type="button"
                class="period-segment"
                [class.active]="period === 'AM'"
                (click)="setPeriod('AM')"
            >
                AM
            </button>
            <button
                type="button"
                class="period-segment"
                [class.active]="period === 'PM'"
                (click)="setPeriod('PM')"
            >
                PM
            </button>
        </div>
    </div>

    <!-- Column Grid Pickers -->
    <div class="columns-container">
        <!-- Hours Column -->
        <div class="column-group">
            <span class="column-label">Hour</span>
            <div class="column-scroll">
                @for (h of hours; track h) {
                    <button
                        type="button"
                        class="column-item"
                        [class.active]="hour === h"
                        (click)="setHour(h)"
                    >
                        {{ h.toString().padStart(2, '0') }}
                    </button>
                }
            </div>
        </div>

        <!-- Minutes Column -->
        <div class="column-group">
            <span class="column-label">Minute</span>
            <div class="column-scroll">
                @for (m of minuteOptions; track m) {
                    <button
                        type="button"
                        class="column-item"
                        [class.active]="minute === m"
                        (click)="setMinute(m)"
                    >
                        {{ m.toString().padStart(2, '0') }}
                    </button>
                }
            </div>
        </div>

        <!-- Period Column -->
        <div class="column-group column-group--period">
            <span class="column-label">Period</span>
            <div class="column-scroll column-scroll--period">
                <button
                    type="button"
                    class="column-item period-item"
                    [class.active]="period === 'AM'"
                    (click)="setPeriod('AM')"
                >
                    AM
                </button>
                <button
                    type="button"
                    class="column-item period-item"
                    [class.active]="period === 'PM'"
                    (click)="setPeriod('PM')"
                >
                    PM
                </button>
            </div>
        </div>
    </div>

    <!-- Footer Actions -->
    <div class="picker-footer">
        <button type="button" class="btn btn-ghost" (click)="close()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="confirm()">
            <span class="material-icons">check</span> Set Time
        </button>
    </div>
</div>
