<div class="gauge-chart-container" (click)="onGaugeClick()" role="img" aria-label="Speedometer gauge chart">
    <div class="gauge-wrap">
        <svg class="gauge-svg" viewBox="0 0 100 100">
            <circle
                cx="50"
                cy="50"
                r="40"
                stroke="#1e293b"
                [attr.stroke-width]="arcThickness()"
                fill="none"
                stroke-dasharray="125.6 251.2"
            />
            <circle
                class="gauge-arc"
                cx="50"
                cy="50"
                r="40"
                [attr.stroke]="'url(#gaugeGradient-' + uid + ')'"
                [attr.stroke-width]="arcThickness()"
                fill="none"
                [attr.stroke-dasharray]="gaugeArcDash()"
                stroke-linecap="round"
            />
            <defs>
                <linearGradient [attr.id]="'gaugeGradient-' + uid" x1="0%" y1="0%" x2="100%" y2="0%">
                    @for (stop of gradientStops(); track stop.offset) {
                        <stop [attr.offset]="stop.offset" [attr.stop-color]="stop.color" />
                    }
                </linearGradient>
            </defs>
        </svg>
    </div>
    <div class="gauge-center-text">
        <span class="gauge-percent num">{{ title() ? title() : percent() + '%' }}</span>
        <p class="gauge-sub">{{ subtitle() }}</p>
    </div>
</div>
