<button
    type="button"
    class="filter-trigger"
    [class.engaged]="open() || activeCount() > 0"
    [class.icon-only]="!showLabel()"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="label() || 'Advanced filters'"
    [title]="label() || 'Advanced filters'"
    aria-haspopup="dialog"
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    (click)="toggle()"
>
    <span class="material-icons filter-trigger-icon">tune</span>
    @if (showLabel()) {
        <span class="filter-trigger-label">{{ label() }}</span>
    }
    @if (activeCount() > 0) {
        <span class="filter-count">{{ activeCount() }}</span>
    }
</button>

<ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="open()"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="fintrack-filter-backdrop"
    [cdkConnectedOverlayPositions]="[
        { originX: 'end', originY: 'bottom', overlayX: 'end', overlayY: 'top', offsetY: 8 },
        { originX: 'end', originY: 'top', overlayX: 'end', overlayY: 'bottom', offsetY: -8 },
        { originX: 'start', originY: 'bottom', overlayX: 'start', overlayY: 'top', offsetY: 8 },
        { originX: 'start', originY: 'top', overlayX: 'start', overlayY: 'bottom', offsetY: -8 },
        { originX: 'center', originY: 'bottom', overlayX: 'center', overlayY: 'top', offsetY: 8 },
        { originX: 'center', originY: 'top', overlayX: 'center', overlayY: 'bottom', offsetY: -8 }
    ]"
    [cdkConnectedOverlayPush]="true"
    [cdkConnectedOverlayFlexibleDimensions]="true"
    [cdkConnectedOverlayViewportMargin]="12"
    (backdropClick)="close()"
    (detach)="close()"
    (overlayKeydown)="$event.key === 'Escape' && close()"
>
    <section class="filter-panel overlay-panel animate-fade-in" cdkTrapFocus [cdkTrapFocusAutoCapture]="false">
        <header class="filter-panel-head">
            <h4 class="filter-panel-title">
                <span class="material-icons">filter_alt</span>
                {{ panelTitle() }}
            </h4>
            <div class="filter-panel-actions">
                @if (activeCount() > 0) {
                    <button type="button" class="filter-reset" (click)="onReset()">Reset</button>
                }
                <button type="button" class="filter-close" (click)="close()" aria-label="Close filters">
                    <span class="material-icons">close</span>
                </button>
            </div>
        </header>

        <div class="filter-panel-body">
            <ng-content></ng-content>
        </div>

        <footer class="filter-panel-foot">
            <button type="button" class="btn btn-ghost filter-clear-btn" (click)="onReset()">
                <span class="material-icons">restart_alt</span>
                {{ resetLabel() }}
            </button>
            <button type="button" class="btn btn-primary filter-apply" (click)="onApply()">{{ applyLabel() }}</button>
        </footer>
    </section>
</ng-template>
