<button
    type="button"
    class="filter-trigger"
    [class.engaged]="open() || activeCount() > 0"
    [attr.aria-expanded]="open()"
    aria-haspopup="dialog"
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    (click)="toggle()"
>
    <span class="material-icons filter-trigger-icon">tune</span>
    <span>{{ label() }}</span>
    @if (activeCount() > 0) {
        <span class="filter-count">{{ activeCount() }}</span>
    }
</button>

<ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="open()"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    [cdkConnectedOverlayPositions]="[
        { originX: 'end', originY: 'bottom', overlayX: 'end', overlayY: 'top', offsetY: 12 },
        { originX: 'end', originY: 'top', overlayX: 'end', overlayY: 'bottom', offsetY: -12 },
    ]"
    (backdropClick)="close()"
    (detach)="close()"
    (overlayKeydown)="$event.key === 'Escape' && close()"
>
    <section class="filter-panel overlay-panel animate-fade-in" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
        <header class="filter-panel-head">
            <h4 class="filter-panel-title">
                <span class="material-icons">filter_alt</span>
                {{ panelTitle() }}
            </h4>
            <div class="filter-panel-actions">
                @if (activeCount() > 0) {
                    <button type="button" class="filter-reset" (click)="onReset()">Reset</button>
                }
                <button type="button" class="filter-close" (click)="close()" aria-label="Close filters">
                    <span class="material-icons">close</span>
                </button>
            </div>
        </header>

        <div class="filter-panel-body">
            <ng-content></ng-content>
        </div>

        <footer class="filter-panel-foot">
            <button type="button" class="btn btn-primary filter-apply" (click)="close()">{{ applyLabel() }}</button>
        </footer>
    </section>
</ng-template>
