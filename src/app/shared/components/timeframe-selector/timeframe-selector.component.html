<div
    class="timeframe-container"
    [class.timeframe-container--sm]="size() === 'sm'"
    [class.timeframe-container--compact]="variant() === 'compact' || variant() === 'dropdown'"
>
    @if (variant() === 'dropdown' || variant() === 'compact') {
        <div class="timeframe-select-wrap">
            <span class="material-icons select-icon">calendar_today</span>
            <select
                class="timeframe-select"
                [attr.aria-label]="ariaLabel()"
                [value]="activeTimeframe()"
                (change)="onDropdownChange($event)"
            >
                @for (frame of timeframes(); track frame) {
                    <option [value]="frame">{{ getLabel(frame) }}</option>
                }
            </select>
            <span class="material-icons select-arrow">expand_more</span>
        </div>
    } @else {
        <div
            class="timeframe-switch"
            [class.timeframe-switch--segmented]="variant() === 'segmented'"
            role="group"
            [attr.aria-label]="ariaLabel()"
        >
            @for (frame of timeframes(); track frame) {
                <button
                    type="button"
                    class="timeframe-btn"
                    [class.active]="frame === activeTimeframe()"
                    [attr.aria-pressed]="frame === activeTimeframe()"
                    [matTooltip]="getTooltip(frame)"
                    matTooltipPosition="above"
                    (click)="selectTimeframe(frame)"
                >
                    {{ frame }}
                </button>
            }
        </div>
    }

    @if (activeTimeframe() === 'Custom' || showCustomRange()) {
        <div class="custom-range-grid animate-fade-in">
            <app-date-picker
                [value]="customStart"
                label="Start Date"
                placeholder="YYYY-MM-DD"
                ariaLabel="Start date"
                (valueChange)="onCustomStartChange($event)"
            ></app-date-picker>
            <app-date-picker
                [value]="customEnd"
                label="End Date"
                placeholder="YYYY-MM-DD"
                ariaLabel="End date"
                (valueChange)="onCustomEndChange($event)"
            ></app-date-picker>
        </div>
    }
</div>
