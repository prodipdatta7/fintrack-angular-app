<div class="confirm animate-scale-up">
    <div class="confirm-head">
        <span class="icon-tile confirm-icon" [class.confirm-icon--danger]="data.danger">
            <span class="material-icons">{{ data.danger ? 'delete_outline' : 'help_outline' }}</span>
        </span>
        <div>
            <h3 class="confirm-title">{{ data.title }}</h3>
            <p class="confirm-message">{{ data.message }}</p>
        </div>
    </div>

    <div class="confirm-actions">
        <button type="button" class="btn btn-ghost" (click)="cancel()">
            {{ data.cancelLabel || 'Cancel' }}
        </button>
        <button
            type="button"
            class="btn"
            [class.btn-danger]="data.danger"
            [class.btn-primary]="!data.danger"
            (click)="confirm()"
            cdkFocusInitial
        >
            {{ data.confirmLabel || 'Confirm' }}
        </button>
    </div>
</div>
