@if (toasts().length) {
    <div class="toast-stack" role="status" aria-live="polite">
        @for (toast of toasts(); track toast.id) {
            <button
                type="button"
                class="toast animate-toast-in"
                [class]="'toast--' + toast.type"
                (click)="dismiss(toast)"
                title="Dismiss"
            >
                <span class="material-icons toast-icon">{{ icon(toast.type) }}</span>
                <span class="toast-message">{{ toast.message }}</span>
            </button>
        }
    </div>
}
